{% extends "base.html" %}
{% block title %}Comprobante{% endblock %}
{% block page_title %}Detalle de comprobante{% endblock %}

{% block content %}
{% include "components/_toast.html" %}

<div x-data="comprobanteDetail({{ comprobante_id }})" x-init="cargar()" class="space-y-4 max-w-6xl mx-auto">

  <template x-if="loading">
    <div class="text-center py-20">
      <svg class="animate-spin w-10 h-10 mx-auto text-blaugrana-500" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
        <path fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" class="opacity-75"></path>
      </svg>
    </div>
  </template>

  <template x-if="!loading && c">
    <div class="space-y-4">
      <!-- Header -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <div class="flex flex-wrap justify-between items-start gap-4">
          <div>
            <div class="flex items-center gap-3">
              <span class="inline-flex items-center px-3 py-1 rounded-lg text-sm font-semibold"
                    :class="{
                      '01': 'bg-blaugrana-50 text-blaugrana-700',
                      '03': 'bg-blaugrana-grana-50 text-blaugrana-grana-700',
                      '07': 'bg-purple-50 text-purple-700',
                      '08': 'bg-orange-50 text-orange-700'
                    }[c.tipo_documento]"
                    x-text="tipoLabel(c.tipo_documento)"></span>
              <h2 class="font-display font-bold text-2xl text-gray-900" x-text="c.numero_completo"></h2>
              <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-semibold border"
                    :class="estadoClase(c.estado)" x-text="estadoLabel(c.estado)"></span>
            </div>
            <div class="mt-2 text-sm text-gray-600">
              <span class="font-medium" x-text="c.cliente_razon_social"></span>
              <span class="text-gray-400 mx-1">•</span>
              <span x-text="docLabel(c.cliente_tipo_doc) + ' ' + c.cliente_numero_doc"></span>
              <span class="text-gray-400 mx-1">•</span>
              <span x-text="c.fecha_emision"></span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs uppercase text-gray-500">Total</div>
            <div class="font-display font-bold text-3xl text-blaugrana-500"
                 x-text="monedaSimbolo(c.moneda) + ' ' + (c.total_venta || 0).toFixed(2)"></div>
          </div>
        </div>

        <!-- Acciones -->
        <div class="mt-4 flex flex-wrap gap-2 pt-4 border-t border-gray-100">
          <a :href="'/api/comprobantes/' + c.id + '/pdf'" target="_blank"
            class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 inline-flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            PDF
          </a>
          <a :href="'/api/comprobantes/' + c.id + '/xml'" target="_blank"
            class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 inline-flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
            </svg>
            XML
          </a>
          <a x-show="c.estado === 'A'" :href="'/api/comprobantes/' + c.id + '/cdr'" target="_blank"
            class="px-3 py-1.5 text-sm rounded-lg border border-green-300 text-green-700 hover:bg-green-50 inline-flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            CDR
          </a>
          <button x-show="c.estado === 'P' || c.estado === 'R'" @click="reintentarSunat()" :disabled="trabajando"
            class="px-3 py-1.5 text-sm rounded-lg bg-blaugrana-500 hover:bg-blaugrana-600 text-white disabled:opacity-50">
            Reintentar SUNAT
          </button>
          <button x-show="c.estado === 'P'" @click="anularLocal()" :disabled="trabajando"
            class="px-3 py-1.5 text-sm rounded-lg border border-red-300 text-red-700 hover:bg-red-50">
            Anular localmente
          </button>
          <a x-show="c.estado === 'A'" href="/comunicacion-baja/nueva"
            class="px-3 py-1.5 text-sm rounded-lg border border-blaugrana-grana-500 text-blaugrana-grana-500 hover:bg-blaugrana-grana-50">
            Comunicar baja
          </a>
        </div>
      </div>

      <!-- Tabs -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100" x-data="{ tab: 'datos' }">
        <div class="border-b border-gray-200 flex flex-wrap">
          <button @click="tab='datos'" :class="tab==='datos' ? 'text-blaugrana-500 border-blaugrana-500' : 'text-gray-600 border-transparent'" class="px-5 py-3 border-b-2 font-medium text-sm">Datos generales</button>
          <button @click="tab='items'" :class="tab==='items' ? 'text-blaugrana-500 border-blaugrana-500' : 'text-gray-600 border-transparent'" class="px-5 py-3 border-b-2 font-medium text-sm">Items</button>
          <button @click="tab='sunat'" :class="tab==='sunat' ? 'text-blaugrana-500 border-blaugrana-500' : 'text-gray-600 border-transparent'" class="px-5 py-3 border-b-2 font-medium text-sm">SUNAT</button>
          <button @click="tab='pdf'" :class="tab==='pdf' ? 'text-blaugrana-500 border-blaugrana-500' : 'text-gray-600 border-transparent'" class="px-5 py-3 border-b-2 font-medium text-sm">PDF</button>
        </div>

        <!-- Datos -->
        <div x-show="tab==='datos'" class="p-5">
          <dl class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div><dt class="text-xs uppercase text-gray-500">Tipo</dt><dd class="font-medium" x-text="tipoLabel(c.tipo_documento)"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Número</dt><dd class="font-medium" x-text="c.numero_completo"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Fecha emisión</dt><dd x-text="c.fecha_emision"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Moneda</dt><dd x-text="c.moneda + ' (TC ' + (c.tipo_cambio || 1).toFixed(3) + ')'"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Cliente</dt><dd class="font-medium" x-text="c.cliente_razon_social"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Documento</dt><dd x-text="docLabel(c.cliente_tipo_doc) + ' ' + c.cliente_numero_doc"></dd></div>
            <div class="md:col-span-2"><dt class="text-xs uppercase text-gray-500">Dirección</dt><dd x-text="c.cliente_direccion || '—'"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Forma de pago</dt><dd x-text="c.forma_pago"></dd></div>
            <div x-show="c.detraccion_codigo">
              <dt class="text-xs uppercase text-gray-500">Detracción</dt>
              <dd x-text="(c.detraccion_codigo || '') + ' (' + (c.detraccion_tasa || 0) + '%) — ' + monedaSimbolo(c.moneda) + ' ' + (c.detraccion_monto || 0).toFixed(2)"></dd>
            </div>
            <div class="md:col-span-2" x-show="c.observaciones">
              <dt class="text-xs uppercase text-gray-500">Observaciones</dt>
              <dd class="whitespace-pre-line" x-text="c.observaciones"></dd>
            </div>
          </dl>

          <div class="mt-5 grid grid-cols-2 md:grid-cols-4 gap-3 text-sm border-t border-gray-100 pt-4">
            <div><dt class="text-xs uppercase text-gray-500">Subtotal</dt><dd class="font-medium" x-text="(c.subtotal || 0).toFixed(2)"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">IGV</dt><dd class="font-medium" x-text="(c.total_igv || 0).toFixed(2)"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Gravado</dt><dd x-text="(c.total_gravado || 0).toFixed(2)"></dd></div>
            <div><dt class="text-xs uppercase text-gray-500">Total</dt><dd class="font-bold text-base text-blaugrana-500" x-text="monedaSimbolo(c.moneda) + ' ' + (c.total_venta || 0).toFixed(2)"></dd></div>
          </div>
        </div>

        <!-- Items -->
        <div x-show="tab==='items'" class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr class="text-left text-xs uppercase tracking-wider text-gray-600">
                <th class="px-4 py-2">#</th>
                <th class="px-4 py-2">Código</th>
                <th class="px-4 py-2">Descripción</th>
                <th class="px-4 py-2">UM</th>
                <th class="px-4 py-2 text-right">Cant.</th>
                <th class="px-4 py-2 text-right">V. Unit.</th>
                <th class="px-4 py-2 text-right">IGV</th>
                <th class="px-4 py-2 text-right">Total</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="d in detalles" :key="d.id">
                <tr class="border-b border-gray-100">
                  <td class="px-4 py-2 text-gray-500" x-text="d.orden"></td>
                  <td class="px-4 py-2 text-gray-600" x-text="d.codigo || '—'"></td>
                  <td class="px-4 py-2" x-text="d.descripcion"></td>
                  <td class="px-4 py-2" x-text="d.unidad_medida"></td>
                  <td class="px-4 py-2 text-right" x-text="(d.cantidad || 0).toFixed(2)"></td>
                  <td class="px-4 py-2 text-right" x-text="(d.valor_unitario || 0).toFixed(2)"></td>
                  <td class="px-4 py-2 text-right" x-text="(d.igv_monto || 0).toFixed(2)"></td>
                  <td class="px-4 py-2 text-right font-medium" x-text="(d.total_linea || 0).toFixed(2)"></td>
                </tr>
              </template>
              <template x-if="detalles.length === 0">
                <tr><td colspan="8" class="px-4 py-6 text-center text-gray-400">Sin items</td></tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- SUNAT -->
        <div x-show="tab==='sunat'" class="p-5 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="bg-gray-50 rounded-lg p-3">
              <div class="text-xs uppercase text-gray-500">Código CDR</div>
              <div class="font-mono font-medium" x-text="c.cdr_codigo || '—'"></div>
            </div>
            <div class="bg-gray-50 rounded-lg p-3 md:col-span-2">
              <div class="text-xs uppercase text-gray-500">Descripción</div>
              <div x-text="c.cdr_descripcion || '—'"></div>
            </div>
          </div>
          <div>
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Bitácora de envíos</h4>
            <table class="min-w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
              <thead class="bg-gray-50">
                <tr class="text-left text-xs uppercase tracking-wider text-gray-600">
                  <th class="px-3 py-2">Intento</th>
                  <th class="px-3 py-2">Estado</th>
                  <th class="px-3 py-2">Código</th>
                  <th class="px-3 py-2">Descripción</th>
                  <th class="px-3 py-2">Enviado</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="env in envios" :key="env.id">
                  <tr class="border-t border-gray-100">
                    <td class="px-3 py-2" x-text="env.intento"></td>
                    <td class="px-3 py-2" x-text="env.estado"></td>
                    <td class="px-3 py-2" x-text="env.codigo_respuesta || '—'"></td>
                    <td class="px-3 py-2" x-text="env.descripcion_respuesta || '—'"></td>
                    <td class="px-3 py-2 text-xs text-gray-500" x-text="env.enviado_at || env.created_at"></td>
                  </tr>
                </template>
                <template x-if="envios.length === 0">
                  <tr><td colspan="5" class="px-3 py-4 text-center text-gray-400">Sin envíos registrados</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- PDF preview -->
        <div x-show="tab==='pdf'" class="p-5">
          <iframe :src="'/api/comprobantes/' + c.id + '/pdf?inline=1'" class="w-full h-[700px] border border-gray-200 rounded-lg"></iframe>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function comprobanteDetail(id) {
  return {
    id: id, c: null, detalles: [], envios: [],
    loading: true, trabajando: false,

    async cargar() {
      this.loading = true;
      try {
        const res = await fetch('/api/comprobantes/' + this.id);
        if (!res.ok) throw new Error('No se pudo cargar');
        const data = await res.json();
        this.c = data;
        this.detalles = data.detalles || data.items || [];
        this.envios = data.envios || [];
      } catch (e) {
        window.toast('error', e.message);
      } finally {
        this.loading = false;
      }
    },

    async reintentarSunat() {
      this.trabajando = true;
      try {
        const res = await fetch('/api/comprobantes/' + this.id + '/reintentar', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error');
        window.toast('success', 'Reintento enviado');
        await this.cargar();
      } catch (e) { window.toast('error', e.message); }
      finally { this.trabajando = false; }
    },

    async anularLocal() {
      if (!confirm('¿Anular localmente este comprobante? No se enviará a SUNAT.')) return;
      this.trabajando = true;
      try {
        const res = await fetch('/api/comprobantes/' + this.id + '/anular', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error');
        window.toast('success', 'Comprobante anulado');
        await this.cargar();
      } catch (e) { window.toast('error', e.message); }
      finally { this.trabajando = false; }
    },

    tipoLabel(t) { return { '01': 'Factura', '03': 'Boleta', '07': 'Nota Crédito', '08': 'Nota Débito' }[t] || t; },
    docLabel(t) { return { '1': 'DNI', '6': 'RUC', '4': 'CE', '7': 'PAS', '0': 'S/D' }[t] || ''; },
    monedaSimbolo(m) { return { 'PEN': 'S/', 'USD': '$', 'EUR': '€' }[m] || m; },
    estadoLabel(e) { return { 'A': 'Aceptado', 'P': 'Pendiente', 'R': 'Rechazado', 'B': 'Anulado', 'X': 'Comunic. baja' }[e] || e; },
    estadoClase(e) {
      return {
        'A': 'bg-green-100 text-green-700 border-green-200',
        'P': 'bg-yellow-100 text-yellow-800 border-yellow-200',
        'R': 'bg-red-100 text-red-700 border-red-200',
        'B': 'bg-gray-200 text-gray-600 border-gray-300',
        'X': 'bg-blaugrana-grana-50 text-blaugrana-grana-700 border-blaugrana-grana-200',
      }[e] || 'bg-gray-100 text-gray-700 border-gray-200';
    },
  };
}
</script>
{% endblock %}
