{# Input de búsqueda con debounce — útil con x-model.debounce #}
{% macro search_input(model='q', placeholder='Buscar...', extra_class='') -%}
<div class="relative">
  <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
  </svg>
  <input
    type="text"
    placeholder="{{ placeholder }}"
    x-model.debounce.400ms="{{ model }}"
    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blaugrana-500 focus:border-blaugrana-500 outline-none {{ extra_class }}"
  />
</div>
{%- endmacro %}
