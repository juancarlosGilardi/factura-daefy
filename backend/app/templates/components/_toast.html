{# Toast notifications globales — escucha CustomEvent('toast', {detail: {tipo, mensaje}}) #}
<div
  x-data="{
    toasts: [],
    add(t) {
      const id = Date.now() + Math.random();
      this.toasts.push({ id, ...t });
      setTimeout(() => this.remove(id), t.duracion || 4500);
    },
    remove(id) {
      this.toasts = this.toasts.filter(t => t.id !== id);
    }
  }"
  @toast.window="add($event.detail)"
  class="fixed top-5 right-5 z-50 space-y-2 w-80"
>
  <template x-for="t in toasts" :key="t.id">
    <div
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-x-4"
      x-transition:enter-end="opacity-100 translate-x-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="rounded-lg shadow-lg border p-3 pr-8 relative bg-white"
      :class="{
        'border-green-300 bg-green-50 text-green-800': t.tipo === 'success',
        'border-red-300 bg-red-50 text-red-800': t.tipo === 'error',
        'border-blaugrana-200 bg-blaugrana-50 text-blaugrana-800': t.tipo === 'info' || !t.tipo,
        'border-yellow-300 bg-yellow-50 text-yellow-800': t.tipo === 'warning'
      }"
    >
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <template x-if="t.tipo === 'success'">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </template>
          <template x-if="t.tipo === 'error'">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </template>
          <template x-if="t.tipo === 'warning'">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </template>
          <template x-if="t.tipo === 'info' || !t.tipo">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </template>
        </svg>
        <div class="text-sm" x-text="t.mensaje"></div>
      </div>
      <button @click="remove(t.id)" class="absolute top-2 right-2 opacity-50 hover:opacity-100">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </template>
</div>

<script>
  // Helper global para disparar toasts desde cualquier componente Alpine
  window.toast = function(tipo, mensaje, duracion) {
    window.dispatchEvent(new CustomEvent('toast', { detail: { tipo, mensaje, duracion } }));
  };
</script>
