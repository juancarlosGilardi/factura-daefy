[project]
name = "factura-mdb"
version = "0.1.0"
description = "Facturador SUNAT que lee y escribe directo a archivo .mdb (Access). Coexiste con SIAP legacy."
requires-python = ">=3.11"
authors = [{ name = "JuanCarlosPlus" }]
readme = "README.md"
license = { text = "Proprietary" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["E402"]  # Routers se importan después de definir app
